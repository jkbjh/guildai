default_stages: [commit, push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]

  # - repo: https://github.com/jendrikseipp/vulture
  #   rev: 'v2.3'  # or any later Vulture version
  #   hooks:
  #     - id: vulture

  - repo: https://github.com/google/yapf
    rev: 'v0.43.0'
    hooks:
      - id: yapf

