# [tool.black]
# # Skip string normalization to preserve the original quote style
# skip-string-normalization = true

# # Set line length similar to YAPF's column limit
# line-length = 88

# # Attempt to match exclusion patterns
# exclude = 'guild/tests/samples|guild/_skopt|\.?venv'

# # Extend-exclude to handle Jupyter notebooks as in the original setting
# extend-exclude = '\.ipynb'

# # Black auto-wraps expressions that fit within a single line and places brackets
# # which might not align exactly with YAPF's split_before settings.
# # Black does not support setting allow_multiline_dictionary_keys or allow_split_before_dict_value.

[tool.vulture]

paths = ["setup.py", "tools.py", "guild"]
exclude = [
  "guild/_lex",
  "guild/_skopt",
  "guild/_yacc",
  "guild/filter.py",
  "guild/query/qlex.py",
  "guild/query/qparse.py",
  "guild/tests",
  "guild/timerange/trlex.py",
  "guild/timerange/trparse.py",
]
ignore_names = [
  "_unused",
]

[tool.yapfignore]

ignore_patterns = [
  "guild/tests/samples/*",
  "guild/_skopt/*",
  "venv/*",
  ".venv/*",
  "**/venv/*",
  "**/.venv/*",
  "build/*",
  "**/build/*",
]

[tool.yapf]

allow_multiline_dictionary_keys = true
allow_split_before_dict_value = false
blank_line_before_module_docstring = true
blank_line_before_nested_class_or_def = false
column_limit = 88
dedent_closing_brackets = true
join_multiple_lines = false
space_between_ending_comma_and_closing_bracket = false
split_before_arithmetic_operator = true
split_before_bitwise_operator = true
split_before_dot = true
split_before_logical_operator = true
